# Render blueprint for godley-os-bot: one always-on Node web service.
# Render auto-detects this file when it sits at the ROOT of the connected
# repo. If you connect the godleyinnovations monorepo instead of a dedicated
# repo, skip blueprint auto-detection and create the service by hand with
# Root Directory = services/godley-os-bot (see README "Deploy to Render").
#
# PORT is not listed below on purpose: Render injects it automatically and
# src/index.ts binds to it.
services:
  - type: web
    name: godley-os-bot
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BLOTATO_API_KEY
        sync: false
