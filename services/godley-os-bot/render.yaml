# Render configuration of record for godley-os-bot: one always-on Node web
# service. The deploy path is the godleyinnovations monorepo with Root
# Directory = services/godley-os-bot, entered by hand in the dashboard (see
# README "Deploy to Render") — Render's blueprint auto-detection only reads
# a repo-root render.yaml, so this file is documentation there, and becomes
# auto-detectable if the service ever moves to its own repo.
#
# PORT is not listed below on purpose: Render injects it automatically and
# src/index.ts binds to it.
#
# Values: every `sync: false` entry is populated by Doppler's Render
# integration from the vault config godley-os/prd (docs/secrets.md) — never
# typed into the dashboard. The list below is the bot's contract, i.e. the
# names src/ reads.
services:
  - type: web
    name: godley-os-bot
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OWNER_SLACK_USER_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BLOTATO_API_KEY
        sync: false
      # One AI account: both model clients call OpenRouter with this key by
      # default; ANTHROPIC_API_KEY / OPENAI_API_KEY above are the
      # direct-provider fallback behind AI_PROVIDER=direct (unset = OpenRouter
      # when this key is present).
      - key: OPENROUTER_API_KEY
        sync: false
