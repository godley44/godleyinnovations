# Render configuration of record for godley-os-bot: one always-on Node web
# service. The deploy path is the godleyinnovations monorepo with Root
# Directory = services/godley-os-bot, entered by hand in the dashboard (see
# README "Deploy to Render") — Render's blueprint auto-detection only reads
# a repo-root render.yaml, so this file is documentation there, and becomes
# auto-detectable if the service ever moves to its own repo.
#
# PORT is not listed below on purpose: Render injects it automatically and
# src/index.ts binds to it.
services:
  - type: web
    name: godley-os-bot
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BLOTATO_API_KEY
        sync: false
