# Runs the same `npm run check` + build that should be run before every push,
# so a push from a tablet (where nothing can be run locally) still gets
# checked before it reaches main / Vercel.
name: checks
on:
  push:
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          # Non-empty placeholders, not "": with an empty/undefined URL the
          # bundler proves the supabase client is always null and tree-shakes
          # the whole app out of the bundle. Real values live only in Vercel.
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_ANON_KEY: "placeholder-anon-key"
      # Assert the built bundle actually contains the app (see script header).
      - run: node scripts/check-bundle.mjs

  # godley-os-bot is its own npm package (services/godley-os-bot, deployed to
  # Render, not Vercel); compile it here so a broken bot can't reach main
  # unnoticed. Same build command Render runs.
  bot-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/godley-os-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/godley-os-bot/package-lock.json
      - run: npm ci
      - run: npm run build

  # The migrations are applied by hand in production, so CI is the only place
  # the SQL executes before the real database. Applies every migration in
  # order to a real Postgres 16, then runs the behavioral pipeline test
  # (apply_proposal, double-apply block, RLS isolation).
  sql-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run pipeline test
        env:
          PGURL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/shim.sql
          for f in supabase/migrations/*.sql; do
            echo "== applying $f"
            psql "$PGURL" -v ON_ERROR_STOP=1 -f "$f"
          done
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/pipeline_test.sql
